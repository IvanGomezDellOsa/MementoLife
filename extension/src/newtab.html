<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- El titulo se localiza en newtab.ts. Chrome no expande __MSG_ en HTML, y sin <title>
     mostraria la URL como nombre de la pestana (RESTRICCIONES-CHROME-WEB-STORE.md 3.6). -->
<title>New tab</title>
<style>
  /* Inline a proposito: la CSP por defecto de MV3 restringe script-src, NO los estilos.
     Esto pinta el fondo en el primer cuadro, sin esperar a ningun archivo. */
  /* --settings-idle NO es el mismo numero en los dos temas, y no es un descuido: la misma
     opacidad rinde distinto contraste segun el fondo. La tinta oscura sobre fondo claro
     apenas mueve la luminancia, asi que 0.22 daba 1.53:1 en claro contra 1.79:1 en oscuro
     — el engranaje era practicamente invisible en modo claro. Estos dos valores estan
     calculados para dejar los dos temas en ~3:1 (WCAG 1.4.11, componentes no textuales),
     que es el minimo para un control que ademas es la UNICA puerta a las opciones. */
  :root { --bg: #0f0e0d; --ink: #ece5d8; --danger: #d97757; --settings-idle: 0.38; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f0e8; --ink: #2b2721; --danger: #a33418; --settings-idle: 0.52; }
  }
  /* theme-boot.js estampa data-theme cuando el usuario eligio un tema distinto al del
     sistema; tiene que ganarle al media query en las dos direcciones. */
  :root[data-theme="dark"]  { --bg: #0f0e0d; --ink: #ece5d8; --danger: #d97757; --settings-idle: 0.38; }
  :root[data-theme="light"] { --bg: #f4f0e8; --ink: #2b2721; --danger: #a33418; --settings-idle: 0.52; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* Sin esto los controles nativos —desplegables, barras de scroll, autocompletado— se
     dibujan con la paleta clara del sistema aunque la pagina este en oscuro. */
  :root { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme: light; } }
</style>
<link rel="preload" href="assets/fonts/Fraunces-subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="newtab.css">
<script src="theme-boot.js"></script>
</head>
<body>
  <main id="canvas" aria-live="polite"></main>
  <div id="onboarding" hidden></div>
  <!-- Sin esto, la unica forma de llegar a las opciones era chrome://extensions ->
       Detalles -> Opciones de la extension, que no la encuentra nadie. -->
  <button id="settings" type="button">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        d="M19.1 13.9a1.5 1.5 0 0 0 .3 1.65l.06.06a1.8 1.8 0 1 1-2.55 2.55l-.06-.06a1.5 1.5 0 0 0-1.65-.3 1.5 1.5 0 0 0-.91 1.37v.17a1.8 1.8 0 1 1-3.6 0v-.09a1.5 1.5 0 0 0-.98-1.37 1.5 1.5 0 0 0-1.65.3l-.06.06a1.8 1.8 0 1 1-2.55-2.55l.06-.06a1.5 1.5 0 0 0 .3-1.65 1.5 1.5 0 0 0-1.37-.91h-.17a1.8 1.8 0 1 1 0-3.6h.09a1.5 1.5 0 0 0 1.37-.98 1.5 1.5 0 0 0-.3-1.65l-.06-.06a1.8 1.8 0 1 1 2.55-2.55l.06.06a1.5 1.5 0 0 0 1.65.3h.07a1.5 1.5 0 0 0 .91-1.37v-.17a1.8 1.8 0 1 1 3.6 0v.09a1.5 1.5 0 0 0 .91 1.37 1.5 1.5 0 0 0 1.65-.3l.06-.06a1.8 1.8 0 1 1 2.55 2.55l-.06.06a1.5 1.5 0 0 0-.3 1.65v.07a1.5 1.5 0 0 0 1.37.91h.17a1.8 1.8 0 1 1 0 3.6h-.09a1.5 1.5 0 0 0-1.37.91z"/>
    </svg>
  </button>
  <script type="module" src="newtab.js"></script>
</body>
</html>
