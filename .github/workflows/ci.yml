name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint y tests
        working-directory: android
        run: ./gradlew build

      - name: Subir renders de los fixtures para revisión visual
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-output
          path: android/app/build/golden-output/*.png
          if-no-files-found: warn
