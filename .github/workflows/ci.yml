name: CI

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "render-core/**"
      - "content/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "extension/**"
      - "render-core/**"
      - "content/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: extension

jobs:
  check:
    name: Typecheck, tests y paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El typecheck compila primero porque scripts/ importa desde dist/ y necesita
      # los .d.ts para no caer en any implicito.
      - name: Typecheck estricto
        run: npm run typecheck

      - name: Unit tests y snapshots
        run: npx vitest run

      - name: Armar el paquete
        run: npm run build -- --zip

      - name: Navegador para los e2e
        run: npx playwright install --with-deps chromium

      # xvfb-run porque Chrome no carga extensiones sin cabeza: la suite que valida el
      # manifest y el override de la pestana nueva necesita un display.
      - name: E2E (incluye el test de cero red)
        run: xvfb-run --auto-servernum npx playwright test
        env:
          CI: "true"

      # Los goldens PNG solo tienen sentido generados y comparados en Linux (plan 10.5).
      # Si un caso nuevo todavia no tiene golden, el test lo escribe y queda como artefacto
      # para revisarlo a ojo y commitearlo.
      - name: Guardar goldens nuevos o cambiados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldens
          path: extension/e2e/golden/
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar el reporte si algo falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: extension/playwright-report/
          retention-days: 7

  font:
    name: Cobertura de la fuente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar fonttools
        run: python -m pip install --quiet fonttools brotli

      # Comprueba el .woff2 commiteado contra el charset: si alguien toca el dataset y
      # aparece un glifo nuevo que el subset no tiene, falla aca y no en produccion un
      # dia puntual del anio.
      - name: Verificar que el subset cubre todos los glifos
        run: python scripts/verify-font-coverage.py

  package:
    name: ZIP de la tienda
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [check, font]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Construir el ZIP
        run: npm run build -- --zip

      - uses: actions/upload-artifact@v4
        with:
          name: mementolife-extension
          path: extension/build.zip
          retention-days: 30
